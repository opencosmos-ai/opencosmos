name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The ADR index is generated from the records themselves. Checking it here
      # is what keeps it honest: a stale index is the failure mode that killed
      # this repo's two previous decision-keeping habits, and an index that lies
      # is worse than none because people stop trusting it.
      - name: Check ADR index is current
        run: pnpm adr:index --check
