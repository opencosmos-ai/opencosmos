name: Knowledge Sync

# The corpus moved to opencosmos-ai/knowledge, and that repository's workflow
# now regenerates the graphs, embeds the corpus and rebuilds the site. Leaving
# a push trigger here would give the index two writers for the same content —
# doubling writes against Upstash's 10,000/day ceiling for no benefit.
#
# What remains for this repository is Cosmo's kaizen vectors. Those move to
# opencosmos-ai/cosmo in Phase 5, at which point this workflow is deleted.
#
# The graph step is gone with the corpus. generate-wiki-graph.ts read
# <repo>/knowledge/wiki with no empty-corpus guard, so once knowledge/ was
# deleted a dispatch here would have built an empty graph, written it over
# the key opencosmos-ai/knowledge maintains, and exited 0. The revalidate
# step went with it: /library/graph is no longer fed from this repository.
on:
  workflow_dispatch:

concurrency:
  # Cancel any in-progress run when a new one is dispatched. Safe: the embedder
  # reads the full checkout rather than a delta, so the latest HEAD is complete.
  group: kaizen-embed
  cancel-in-progress: true

jobs:
  sync:
    name: Embed Cosmo's kaizen vectors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Embed the kaizen learning log
        env:
          UPSTASH_VECTOR_REST_URL:   ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: pnpm embed
